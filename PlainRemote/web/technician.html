<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlainRemote — Technician</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 16px;
    background: #F3F0FF;
    color: #222;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label { display: block; font-size: 13px; color: #555; margin: 8px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }
  button {
    background: #6C4FE0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 12px;
    margin-right: 8px;
  }
  button.secondary { background: #E4DEFF; color: #333; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 13px; color: #555; margin-top: 8px; }
  #videoWrap { position: relative; display: none; }
  video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: block;
    cursor: crosshair;
  }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<h1>PlainRemote — Technician side</h1>
<div class="sub">Connects directly (peer-to-peer) to a customer's phone over any network. Firebase is only used to swap the initial connection handshake.</div>

<div class="panel" id="setupPanel">
  <label>Firebase config (paste the whole object from your Firebase project settings → Web app)</label>
  <input id="firebaseConfig" placeholder='{"apiKey":"...","projectId":"...", ...}' />

  <label>Session code (from the customer's phone)</label>
  <input id="sessionCode" placeholder="123456" inputmode="numeric" maxlength="6" />

  <button id="connectBtn">Connect</button>
  <div id="status"></div>
</div>

<div class="panel" id="videoWrap">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="controls">
    <button class="secondary" id="backBtn">◁ Back</button>
    <button class="secondary" id="homeBtn">○ Home</button>
    <button class="secondary" id="disconnectBtn">End session</button>
  </div>
  <div class="sub">Click the video to tap. Click-drag to swipe.</div>
</div>

<!-- Firebase (only used for the small signaling handshake, never the video) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot,
    collection, addDoc, query
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const connectBtn = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const backBtn = document.getElementById('backBtn');
  const homeBtn = document.getElementById('homeBtn');
  const statusEl = document.getElementById('status');
  const setupPanel = document.getElementById('setupPanel');
  const videoWrap = document.getElementById('videoWrap');
  const remoteVideo = document.getElementById('remoteVideo');

  // Same free STUN + free Open Relay Project TURN servers as the Android app,
  // so the connection also works when the technician is behind a strict NAT.
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  ];

  let pc, dataChannel, db, unsubSession, unsubCandidates;

  function setStatus(text) { statusEl.textContent = text; }

  connectBtn.addEventListener('click', async () => {
    const code = document.getElementById('sessionCode').value.trim();
    let cfg;
    try {
      cfg = JSON.parse(document.getElementById('firebaseConfig').value.trim());
    } catch (e) {
      setStatus('Firebase config is not valid JSON.');
      return;
    }
    if (!code) { setStatus('Enter the session code.'); return; }

    connectBtn.disabled = true;
    setStatus('Connecting…');

    const app = initializeApp(cfg);
    db = getFirestore(app);
    const sessionRef = doc(db, 'sessions', code);

    const snap = await getDoc(sessionRef);
    if (!snap.exists() || !snap.data().offer) {
      setStatus('No active session with that code. Ask the customer to start one.');
      connectBtn.disabled = false;
      return;
    }

    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      setupPanel.style.display = 'none';
      videoWrap.style.display = 'block';
      setStatus('Connected.');
    };

    pc.ondatachannel = (event) => attachDataChannel(event.channel);

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        addDoc(collection(sessionRef, 'calleeCandidates'), event.candidate.toJSON());
      }
    };

    const offer = snap.data().offer;
    await pc.setRemoteDescription({ type: offer.type, sdp: offer.sdp });

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(sessionRef, { answer: { type: answer.type, sdp: answer.sdp } });

    unsubCandidates = onSnapshot(
      query(collection(sessionRef, 'callerCandidates')),
      (querySnap) => {
        querySnap.docChanges().forEach((change) => {
          if (change.type === 'added') {
            const d = change.doc.data();
            pc.addIceCandidate(new RTCIceCandidate({
              sdpMid: d.sdpMid, sdpMLineIndex: d.sdpMLineIndex, candidate: d.candidate
            }));
          }
        });
      }
    );
  });

  function attachDataChannel(channel) {
    dataChannel = channel;
    dataChannel.onopen = () => setStatus('Connected — control channel open.');
  }

  function send(cmd) {
    if (dataChannel && dataChannel.readyState === 'open') {
      dataChannel.send(JSON.stringify(cmd));
    }
  }

  // Click = tap. Click-drag = swipe. Coordinates normalized 0..1 against
  // the video's own rendered size so they map correctly on any screen.
  let dragStart = null;
  remoteVideo.addEventListener('pointerdown', (e) => {
    dragStart = pointToNormalized(e);
  });
  remoteVideo.addEventListener('pointerup', (e) => {
    if (!dragStart) return;
    const end = pointToNormalized(e);
    const dist = Math.hypot(end.x - dragStart.x, end.y - dragStart.y);
    if (dist < 0.02) {
      send({ type: 'tap', x: end.x, y: end.y });
    } else {
      send({ type: 'swipe', x1: dragStart.x, y1: dragStart.y, x2: end.x, y2: end.y, duration: 250 });
    }
    dragStart = null;
  });

  function pointToNormalized(e) {
    const rect = remoteVideo.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width,
      y: (e.clientY - rect.top) / rect.height,
    };
  }

  backBtn.addEventListener('click', () => send({ type: 'back' }));
  homeBtn.addEventListener('click', () => send({ type: 'home' }));

  disconnectBtn.addEventListener('click', () => {
    if (pc) pc.close();
    if (unsubCandidates) unsubCandidates();
    videoWrap.style.display = 'none';
    setupPanel.style.display = 'block';
    connectBtn.disabled = false;
    setStatus('Disconnected.');
  });
</script>
</body>
</html>
